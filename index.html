<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オンライン対戦パズルゲーム</title>
  <style>
    body {
      text-align: center;
      background: #222;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }
    canvas {
      background: #000;
      border: 2px solid #fff;
      margin-top: 10px;
    }
    #ui {
      margin: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 0 5px;
    }
    #status-text {
      font-size: 18px;
      color: #ff0;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>対戦パズルゲーム</h1>
  
  <!-- 対戦接続用UI -->
  <div id="ui">
    <button id="btn-host" onclick="createRoom()">ホストとして部屋を作成</button>
    <button id="btn-join" onclick="joinRoom()">フレンドの部屋に参加</button>
    <p id="status-text">「部屋を作成」または「参加」を押してください</p>
  </div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- JavaScriptの読み込み -->
  <script src="game.js"></script>
</body>
</html>
