<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>パズルボブル風 オンライン＆ランキング版</title>
    <!-- PeerJS ライブラリの読み込み -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 384px;
            height: 600px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 画面共通オーバーレイ */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 15px;
        }
        p {
            font-size: 14px;
            color: #ccc;
            margin: 5px 0 15px 0;
            line-height: 1.5;
        }

        /* ボタンデザイン */
        .menu-btn {
            width: 80%;
            max-width: 260px;
            padding: 12px 20px;
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #ff4d4d, #f92323);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
            transition: all 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 5px rgba(255, 77, 77, 0.4);
        }
        .menu-btn.sub {
            background: linear-gradient(135deg, #4da6ff, #1a8cff);
            box-shadow: 0 4px 10px rgba(77, 166, 255, 0.4);
        }
        .menu-btn.gray {
            background: #555555;
            box-shadow: none;
        }
        .menu-btn.danger {
            background: linear-gradient(135deg, #ff4d4d, #d32f2f);
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
        }

        /* 入力フォーム */
        input[type="text"] {
            width: 80%;
            max-width: 260px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #4da6ff;
            background: #222;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        /* テーブルスタイル */
        table {
            width: 90%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 13px;
        }
        th, td {
            padding: 8px 4px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        th {
            color: #ffcc00;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="384" height="600"></canvas>

    <!-- モード選択画面 -->
    <div id="screen-mode" class="overlay-screen">
        <h1>パズルボブル</h1>
        <button class="menu-btn" onclick="startSinglePlay()">👤 ひとりであそぶ (300秒)</button>
        <button class="menu-btn sub" onclick="showScreen('screen-role-select')">⚔️ オンライン対戦</button>
        <button class="menu-btn gray" onclick="showRankingBoard()">🏆 ランキングを見る</button>
    </div>

    <!-- 対戦役割選択画面 -->
    <div id="screen-role-select" class="overlay-screen" style="display:none;">
        <h2>対戦形式を選択</h2>
        <button class="menu-btn" onclick="setupRole('host')">🏠 部屋をつくる (1P)</button>
        <button class="menu-btn sub" onclick="setupRole('guest')">🚪 部屋に入る (2P)</button>
        <button class="menu-btn gray" onclick="showScreen('screen-mode')">戻る</button>
    </div>

    <!-- ホスト待機画面 -->
    <div id="screen-host-wait" class="overlay-screen" style="display:none;">
        <h2>部屋コード作成完了</h2>
        <p>相手に以下の4桁の数字を伝えてください</p>
        <div id="display-room-code" style="font-size:36px; font-weight:bold; color:#ffcc00; letter-spacing:4px; margin:15px 0;">----</div>
        <p style="font-size:12px; color:#aaa;">接続を待っています...</p>
        <button class="menu-btn gray" onclick="cancelNetwork('screen-role-select')">キャンセル</button>
    </div>

    <!-- ホストルール設定画面 -->
    <div id="screen-host-rule-setup" class="overlay-screen" style="display:none;">
        <h2>ルール設定</h2>
        
        <p style="margin-bottom:5px;">対戦モード</p>
        <div style="display:flex; justify-content:center; gap:10px; width:100%; margin-bottom:15px;">
            <button id="btn-mode-ta" class="menu-btn sub" style="width:45%; font-size:13px;" onclick="setHostBattleType('タイムアタック')">⏱️ タイムアタック</button>
            <button id="btn-mode-rally" class="menu-btn gray" style="width:45%; font-size:13px;" onclick="setHostBattleType('ラリー対戦')">🔥 ラリー対戦</button>
        </div>

        <p style="margin-bottom:5px;">勝利条件</p>
        <div style="display:flex; justify-content:center; gap:10px; width:100%; margin-bottom:20px;">
            <button id="btn-win-1" class="menu-btn" style="width:45%; font-size:13px;" onclick="setHostTargetWins(1)">1本先取</button>
            <button id="btn-win-2" class="menu-btn gray" style="width:45%; font-size:13px;" onclick="setHostTargetWins(2)">2本先取</button>
        </div>

        <button class="menu-btn" onclick="confirmHostBattleStart()">次へ（ルール確認）</button>
    </div>

    <!-- ゲスト部屋コード入力画面 -->
    <div id="screen-guest-join" class="overlay-screen" style="display:none;">
        <h2>部屋コード入力</h2>
        <p>ホストから教えてもらった4桁の数字を入力してください</p>
        <input type="text" id="input-room-code" maxlength="4" placeholder="1234">
        <button class="menu-btn sub" onclick="joinRoom()">参加する</button>
        <p id="status-message" style="color:#ff4d4d; font-size:13px;"></p>
        <button class="menu-btn gray" onclick="cancelNetwork('screen-role-select')">戻る</button>
    </div>

    <!-- ゲストルール設定待機画面 -->
    <div id="screen-guest-wait-rule" class="overlay-screen" style="display:none;">
        <h2>接続成功！</h2>
        <p>ホストが対戦ルールを設定しています...<br>しばらくお待ちください。</p>
    </div>

    <!-- 対戦ルール確認画面モーダル -->
    <div id="screen-rule-confirm" class="overlay-screen" style="display:none;">
        <h2>対戦ルール確認</h2>
        <div id="battle-rule-desc"></div>
        <button id="btn-start-battle-now" class="menu-btn" style="margin-top:15px; display:none;">対戦スタート！</button>
    </div>

    <!-- ステージクリア画面 -->
    <div id="screen-stage-clear" class="overlay-screen" style="display:none;">
        <h2 style="color:#4dff4d;">STAGE CLEAR!</h2>
        <p id="clear-score-text">スコア: 0</p>
        <button class="menu-btn" onclick="nextStageAction()">次のステージへ</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="screen-game-over" class="overlay-screen" style="display:none;">
        <h2 id="gameover-title-text" style="color:#ff4d4d;">GAME OVER</h2>
        <p id="gameover-score-text">スコア: 0</p>
        <button id="btn-gameover-action" class="menu-btn" onclick="handleGameOverNextAction()">次へ</button>
        <button class="menu-btn gray" onclick="returnToTitle()">タイトルに戻る</button>
    </div>

    <!-- 名前入力画面 -->
    <div id="screen-name-input" class="overlay-screen" style="display:none;">
        <h2 style="color:#ffcc00;">🎉 ランクイン！</h2>
        <p id="rankin-desc-text"></p>
        <input type="text" id="player-name-input" maxlength="8" placeholder="名前を入力">
        <button class="menu-btn" onclick="submitScoreAndShowRanking()">登録してランキングを見る</button>
    </div>

    <!-- ランキング画面 -->
    <div id="screen-ranking" class="overlay-screen" style="display:none;">
        <h2>🏆 ハイスコアランキング</h2>
        <table>
            <thead>
                <tr>
                    <th>順位</th>
                    <th>名前</th>
                    <th>クリア数</th>
                    <th>スコア</th>
                </tr>
            </thead>
            <tbody id="ranking-list-body"></tbody>
        </table>
        <button class="menu-btn gray" onclick="returnToTitle()">タイトルに戻る</button>
    </div>

    <!-- 設定画面 (スキン変更) -->
    <div id="settings-overlay" class="overlay-screen" style="display:none;">
        <h2>⚙️ 画像カスタマイズ</h2>
        <div id="settings-list" style="width:100%; max-height:360px; overflow-y:auto; display:flex; flex-direction:column; align-items:center;"></div>
        <button class="menu-btn gray" style="margin-top:15px;" onclick="closeSettings()">閉じる</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
