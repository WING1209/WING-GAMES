<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オンライン対戦パズルゲーム</title>
  <style>
    body { text-align: center; background: #222; color: #fff; font-family: sans-serif; }
    canvas { background: #000; border: 2px solid #fff; margin-top: 10px; }
    #ui { margin: 15px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>対戦パズルゲーム</h1>
  
  <!-- 接続設定用UI -->
  <div id="ui">
    <button id="btn-host" onclick="createRoom()">ホストとして部屋を作成</button>
    <button id="btn-join" onclick="joinRoom()">フレンドの部屋に参加</button>
    <p id="status-text">「部屋を作成」または「参加」を押してください</p>
  </div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
// ==========================================
// 1. オーディオ（SE / BGM）のプリロード設定
// ==========================================
const audioPath = 'audio/';

// SE（効果音）の初期化
const se = {
  ballShoot:    new Audio(`${audioPath}se/se_ball_shoot.wav`),
  ballLand:     new Audio(`${audioPath}se/se_ball_land.wav`),
  bombExplode:  new Audio(`${audioPath}se/se_bomb_explode.wav`),
  rainbowLand:  new Audio(`${audioPath}se/se_rainbow_land.wav`),
  rainbowSet:   new Audio(`${audioPath}se/se_rainbow_set.wav`),
  blockFall:    new Audio(`${audioPath}se/se_block_fall.wav`),
  gameOver:     new Audio(`${audioPath}se/se_game_over.wav`),
  stageClear:   new Audio(`${audioPath}se/se_stage_clear.wav`)
};

// SEを遅延なく再生する補助関数（連打対応）
function playSE(sound) {
  if (sound) {
    sound.currentTime = 0; // 再生位置を先頭に戻す
    sound.play().catch(e => console.log("Audio play blocked:", e));
  }
}

// BGMのランダム再生設定
const bgmList = [
  `${audioPath}bgm/bgm_play_01.wav`,
  `${audioPath}bgm/bgm_play_02.wav`,
  `${audioPath}bgm/bgm_play_03.wav`,
  `${audioPath}bgm/bgm_play_04.wav`
];
let currentBGM = null;

function playRandomBGM() {
  const randomIndex = Math.floor(Math.random() * bgmList.length);
  if (currentBGM) currentBGM.pause();
  
  currentBGM = new Audio(bgmList[randomIndex]);
  currentBGM.loop = true; // ループ再生
  currentBGM.play().catch(e => console.log("BGM play blocked:", e));
}


// ==========================================
// 2. ゲーム状態管理とホスト待機処理
// ==========================================
const GameState = {
  IDLE: 'IDLE',            // 初期状態
  WAITING: 'WAITING',      // 相手の参加待ち（★重要：ここでゲーム進行を止める）
  PLAYING: 'PLAYING',      // 対戦中
  GAMEOVER: 'GAMEOVER'     // 終了
};

let currentState = GameState.IDLE;
let isHost = false;
let connection = null; // 通信オブジェクト

const statusText = document.getElementById('status-text');

// ① ホストが部屋を作る処理
function createRoom() {
  isHost = true;
  currentState = GameState.WAITING; // ★即座に開始せず「待機中」にする！
  
  statusText.innerText = "プレイヤー2の参加を待っています...";
  document.getElementById('btn-host').disabled = true;
  document.getElementById('btn-join').disabled = true;

  // 擬似的なネットワーク接続処理（実際はPeerJSやWebSocketを使用）
  mockServerHostListen();
}

// ② フレンド（ゲスト）が部屋に入る処理
function joinRoom() {
  isHost = false;
  statusText.innerText = "ホストに接続中...";
  
  // 擬似的な接続処理
  mockServerConnectHost();
}

// ③ 相手が参加・接続完了した時に呼ばれる関数（対戦開始）
function onOpponentConnected() {
  currentState = GameState.PLAYING;
  statusText.innerText = "対戦開始！";
  
  // BGMをランダムで再生開始
  playRandomBGM();
  
  // 対戦初期化処理へ
  initGame();
}


// ==========================================
// 3. 通信の受信・対戦ループ処理
// ==========================================
function initGame() {
  console.log("ゲームが正常に開始されました");
}

function update() {
  // ★待機状態（WAITING）の時はゲームの計算を行わない
  if (currentState !== GameState.PLAYING) {
    return;
  }

  // --- ここに対戦中の位置計算や判定を書く ---
}

function draw() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 画面描画
  if (currentState === GameState.WAITING) {
    ctx.fillStyle = "#fff";
    ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("フレンドの参加を待っています...", canvas.width / 2, canvas.height / 2);
  } else if (currentState === GameState.PLAYING) {
    ctx.fillStyle = "#0f0";
    ctx.font = "20px sans-serif";
    ctx.fillText("対戦中！", 50, 30);
  }
}

// メインゲームループ
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ループ起動
gameLoop();


// ==========================================
// 4. ネットワーク接続のテスト用ダミー処理
// (※実際の通信用APIに合わせて差し替えてください)
// ==========================================
function mockServerHostListen() {
  // テスト用：3秒後に相手が接続してきたと仮定
  /* 
     本番環境（PeerJS等）ではここを:
     peer.on('connection', (conn) => {
         connection = conn;
         onOpponentConnected(); // 接続されたら開始！
     });
  */
}

function mockServerConnectHost() {
  // テスト用：参加ボタンを押したらホスト側へ通知
  setTimeout(() => {
    onOpponentConnected();
  }, 1000);
}
</script>

</body>
</html>
